<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <style>
    .prompt { stroke: #0d0d0d; }
    .cursor { fill: #0d0d0d; animation: blink 1.1s step-end infinite; }
    @media (prefers-color-scheme: dark) {
      .prompt { stroke: #f5f5f5; }
      .cursor { fill: #f5f5f5; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <polyline class="prompt" points="14,36 46,64 14,92"
    stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="60" y="38" width="54" height="52" rx="4"/>
</svg>
